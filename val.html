

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Valeria ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ffe0ec, #f8b6d0, #ffd9e8);
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.contenedor {
    text-align: center;
    z-index: 2;
}

h2 {
    color: #b52c65;
    font-size: 27px;
}

.sobre {
    position: relative;
    width: 220px;
    height: 145px;
    background: #e96b99;
    margin: 75px auto 20px;
    cursor: pointer;
    border-radius: 5px;
    transition: 0.5s;
}

.sobre::before {
    content: "";
    position: absolute;
    top: -2px;
    left: 0;
    border-left: 110px solid transparent;
    border-right: 110px solid transparent;
    border-top: 90px solid #f48bb0;
    transform-origin: top;
    transition: 0.6s;
    z-index: 4;
}

.sobre::after {
    content: "❤️";
    position: absolute;
    top: 58px;
    left: 93px;
    font-size: 35px;
    z-index: 5;
    transition: 0.4s;
}

.carta {
    position: absolute;
    background: white;
    width: 190px;
    height: 125px;
    left: 15px;
    top: 10px;
    padding: 12px;
    border-radius: 8px;
    color: #c03970;
    font-size: 13px;
    transition: 0.8s;
    z-index: 2;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.sobre.abierto::before {
    transform: rotateX(180deg);
    z-index: 0;
}

.sobre.abierto::after {
    opacity: 0;
}

.sobre.abierto .carta {
    transform: translateY(-105px);
    height: 180px;
    z-index: 6;
    box-shadow: 0 5px 20px #bd638a55;
}

.boton {
    color: #b52c65;
    font-size: 16px;
    margin-top: 15px;
}

.mensaje {
    display: none;
    color: #b52c65;
    animation: aparecer 1.5s;
}

.mensaje h1 {
    font-size: 42px;
    margin-bottom: 5px;
}

.mensaje p {
    font-size: 23px;
}

.mensaje .cara {
    font-size: 55px;
}

@keyframes aparecer {
    from { opacity: 0; transform: scale(0.5); }
    to { opacity: 1; transform: scale(1); }
}

.corazon {
    position: fixed;
    bottom: -30px;
    animation: subir 4s linear forwards;
    pointer-events: none;
}

@keyframes subir {
    to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="contenedor">
    <h2>Una cosita para ti... 💗</h2>

    <div class="sobre" id="sobre" onclick="abrirCarta()">
        <div class="carta">
            Para la niña más especial de mi vida:
            <br><br>
            Gracias por hacerme tan feliz.
            Te quiero muchísimo ❤️
        </div>
    </div>

    <div class="boton" id="instruccion">
        Pulsa el sobre para abrirlo 💌
    </div>

    <div class="mensaje" id="mensaje">
        <h1>TE AMO ❤️</h1>
        <p>Muchísimo, muchísimo.</p>
        <div class="cara">🥰</div>
        <p>Siempre tú. 💗</p>
    </div>
</div>

<script>
function abrirCarta() {
    const sobre = document.getElementById("sobre");

    if (sobre.classList.contains("abierto")) return;

    sobre.classList.add("abierto");

    document.getElementById("instruccion").style.display = "none";

    setTimeout(() => {
        document.getElementById("mensaje").style.display = "block";
        lanzarCorazones();
    }, 1000);
}

function lanzarCorazones() {
    for (let i = 0; i < 55; i++) {
        setTimeout(() => {
            const corazon = document.createElement("div");
            corazon.className = "corazon";
            corazon.innerHTML = ["❤️", "💕", "💗", "💖", "💘"][
                Math.floor(Math.random() * 5)
            ];

            corazon.style.left = Math.random() * 100 + "vw";
            corazon.style.fontSize = (15 + Math.random() * 25) + "px";
            document.body.appendChild(corazon);

            setTimeout(() => corazon.remove(), 4000);
        }, i * 65);
    }
}
</script>

</body>
</html>
